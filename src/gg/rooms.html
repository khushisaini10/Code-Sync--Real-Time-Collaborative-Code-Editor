d-column:1/-1;padding:32px 18px;border:2px dashed var(--ink);border-radius:7px;background:#fffef9;color:var(--muted);text-align:center;font-size:13px}footer{justify-content:space-between;margin:0 8px 8px;border-radius:8px;color:var(--ink);font-size:11px;box-shadow:3px 3px 0 var(--ink)}#connection:before{content:'● ';color:var(--green)}#connection{color:var(--ink);font-weight:700}

<body>

<header>

  <div class="brand">&lt;/&gt; Code-<b>Sync</b></div>

  <div class="spacer"></div>

  <div id="currentUser" class="current-user">Loading user...</div>

  <button id="backUsers" class="ghost">Test Users</button>

</header>



<main>

  <div id="setup" class="room-setup">

    <section class="panel">

      <h2>Create Room</h2>

      <p>Enter a room name, choose the language and set a password.</p>

      <label class="field-label" for="roomNameInput">Room Name</label>

      </select>

      <label class="field-label" for="createPassword">Room Password</label>

      <input id="createPassword" type="password" minlength="4" maxlength="64" autocomplete="new-password" placeholder="Set room password">

    <section class="panel">

      <h2>Join Room</h2>

      <p>Enter the room ID and password shared by the creator.</p>

      <label class="field-label" for="roomInput">Room ID</label>

      <input id="roomInput" maxlength="7" placeholder="CS12345" autocomplete="off" spellcheck="false">

      <label class="field-label" for="joinPassword">Room Password</label>

      <input id="joinPassword" type="password" maxlength="64" autocomplete="current-password" placeholder="Enter room password">

      <div id="joinPreview" class="message"></div>

      <div class="button-row"><button id="joinRoom">Join Room</button></div>

      <div id="joinMessage" class="message"></div>

    </section>

  </div>



  <section id="roomView" class="panel room-view hidden">

    <div class="room-header">

      <div>

        <div style="color:#5C6690;font-size:11px;margin-bottom:3px">ROOM</div>

        <div id="roomIdDisplay" class="room-id"></div>

        <div id="roomNameDisplay" class="room-name-badge">Room Name: -</div>

      </div>

      <div class="spacer"></div>

      <button id="copyInvite" class="ghost">Copy Invite Link</button>

      <button id="deleteRoom" class="danger hidden">Delete Room</button>

    </div>



    <div class="room-info-row">

      <div class="info-chip">Language: <strong id="roomLanguageInfo">-</strong></div>

      <div class="info-chip">Created by: <strong id="roomCreatorInfo">-</strong></div>

      <div class="info-chip">Room: <strong id="roomNameInfo">-</strong></div>

    </div>







    <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px">

      <h2 style="margin:0;font-size:16px">Participants</h2>

      <span id="participantCount" style="color:#5C6690;font-size:11px">0 users</span>

    </div>

    <div id="participants" class="participants">

      <div class="empty">Waiting for participants...</div>

    </div>

  </section>

  <div id="globalMessage" class="message"></div>

</main>






<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {

  getFirestore, doc, getDoc, setDoc, deleteDoc,

  collection, query, orderBy, onSnapshot,

  serverTimestamp, getDocs, writeBatch

} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* CodeSync Firebase project configuration */

const firebaseConfig = {

  apiKey: "AIzaSyAlCzgE3ZKjQ_14HP8QTS6HNZ7zHZf3A6I",

  authDomain: "codesync-3f1c0.firebaseapp.com",

  projectId: "codesync-3f1c0",

  storageBucket: "codesync-3f1c0.firebasestorage.app",

  messagingSenderId: "759410162201",

  appId: "1:759410162201:web:0225888fef8b5b96578888"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const $ = id => document.getElementById(id);



const setup = $("setup");

const roomView = $("roomView");

const currentUserEl = $("currentUser");

const roomNameInput = $("roomNameInput");

const languageSelect = $("languageSelect");

const createPassword = $("createPassword");

const roomInput = $("roomInput");

const joinPassword = $("joinPassword");

const createRoomBtn = $("createRoom");

const joinRoomBtn = $("joinRoom");

const setupMessage = $("setupMessage");

const joinMessage = $("joinMessage");

const globalMessage = $("globalMessage");

const participantsEl = $("participants");

const participantCount = $("participantCount");

const leaveRoomBtn = $("leaveRoom");

const deleteRoomBtn = $("deleteRoom");



function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}

function message(el, text, type = "") {

  el.textContent = text;

  el.className = "message " + type;

}

function globalError(text) { message(globalMessage, text, "error"); }

function globalSuccess(text) {

  message(globalMessage, text, "success");

  setTimeout(() => {

    if (globalMessage.textContent === text) message(globalMessage, "");

  }, 2500);

}



/* Test user selected on users.html */

const storedUser = localStorage.getItem("codesyncTestUser");

if (!storedUser) {

  alert("Please select a test user first.");

  location.href = "users.html";

  throw new Error("No test user selected");

}



let currentUser;

try {

  currentUser = JSON.parse(storedUser);

} catch {

  localStorage.removeItem("codesyncTestUser");

  location.href = "users.html";

  throw new Error("Invalid test user");

}

if (!currentUser.uid || !currentUser.name) {

  location.href = "users.html";

  throw new Error("Incomplete test user");

}

currentUserEl.innerHTML = `User: <strong>${escapeHtml(currentUser.name)}</strong>`;



/* Current-room state */

let currentRoomId = null;

let currentRoomName = null;

let currentRoomLanguage = null;

let currentRoomCreatorName = null;

let roomCreatorUid = null;

let unsubscribeParticipants = null;

let unsubscribeOwnParticipant = null;

let isLeavingRoom = false;

let isDeletingRoom = false;

let ownListenerGeneration = 0;



/* Password digest with a fallback for local testing environments */

async function passwordHash(password) {

  const bytes = new TextEncoder().encode(password);

  if (globalThis.crypto && globalThis.crypto.subtle && globalThis.crypto.subtle.digest) {

    const digest = await globalThis.crypto.subtle.digest("SHA-256", bytes);

    return Array.from(new Uint8Array(digest))

      .map(b => b.toString(16).padStart(2, "0")).join("");

  }

  /* Compatibility fallback for local testing only; use HTTPS/localhost in production. */

  let hash = 2166136261;

  for (const byte of bytes) {

    hash ^= byte;

    hash = Math.imul(hash, 16777619);

  }

  return "fallback-" + (hash >>> 0).toString(16).padStart(8, "0");

}



function makeRoomId() {

  return "CS" + Math.floor(10000 + Math.random() * 90000);

}

async function uniqueRoomId() {

  for (let i = 0; i < 20; i++) {

    const id = makeRoomId();

    if (!(await getDoc(doc(db, "rooms", id))).exists()) return id;

  }

  throw new Error("Could not generate a unique room ID. Try again.");

}



/* Create room */

createRoomBtn.addEventListener("click", async () => {

  message(setupMessage, "");

  const roomName = roomNameInput.value.trim();

  const language = languageSelect.value;

  const password = createPassword.value;



  if (!roomName) return message(setupMessage, "Please enter a room name.", "error");

  if (!language) return message(setupMessage, "Please select a programming language.", "error");

  if (password.length < 4) return message(setupMessage, "Room password must be at least 4 characters.", "error");



  createRoomBtn.disabled = true;

  createRoomBtn.textContent = "Creating...";



  try {

    const roomId = await uniqueRoomId();

    const roomRef = doc(db, "rooms", roomId);

    const hash = await passwordHash(password);



    await setDoc(roomRef, {

      roomId,

      roomName,

      language,

      passwordHash: hash,

      creatorUid: currentUser.uid,

      creatorName: currentUser.name,

      createdAt: serverTimestamp(),

      status: "active"

    });



    await setDoc(doc(db, "rooms", roomId, "participants", currentUser.uid), {

      uid: currentUser.uid,

      name: currentUser.name,

      email: currentUser.email || "",

      phone: currentUser.phone || "",

      role: "admin",

      joinedAt: serverTimestamp()

    });



    await setDoc(doc(collection(db, "rooms", roomId, "activity")), {

      type: "ROOM_CREATED",

      uid: currentUser.uid,

      name: currentUser.name,

      language,

      createdAt: serverTimestamp()

    });



    createPassword.value = "";

    await openRoom(roomId);

  } catch (error) {

    console.error("Create room error:", error);

    message(setupMessage, "Could not create room: " + error.message, "error");

  } finally {

    createRoomBtn.disabled = false;

    createRoomBtn.textContent = "Create Room";

  }

});



/* Join room: both ID and password are required */

joinRoomBtn.addEventListener("click", async () => {

  message(joinMessage, "");

  const roomId = roomInput.value.trim().toUpperCase();

  const password = joinPassword.value;



  if (!/^CS\d{5}$/.test(roomId)) {

    return message(joinMessage, "Room ID must look like CS12345.", "error");

  }

  if (!password) {

    return message(joinMessage, "Please enter the room password.", "error");

  }



  joinRoomBtn.disabled = true;

  joinRoomBtn.textContent = "Joining...";



  try {

    const roomRef = doc(db, "rooms", roomId);

    const roomSnap = await getDoc(roomRef);

    if (!roomSnap.exists()) throw new Error("Room does not exist.");



    const roomData = roomSnap.data();

    if (roomData.status && roomData.status !== "active") {

      throw new Error("This room is not active.");

    }

    if (!roomData.passwordHash) {

      throw new Error("This older room has no password set. Create a new test room.");

    }



    const enteredHash = await passwordHash(password);

    if (enteredHash !== roomData.passwordHash) {

      throw new Error("Incorrect room password.");

    }



    await setDoc(doc(db, "rooms", roomId, "participants", currentUser.uid), {

      uid: currentUser.uid,

      name: currentUser.name,

      email: currentUser.email || "",

      phone: currentUser.phone || "",

      role: currentUser.uid === roomData.creatorUid ? "admin" : "member",

      joinedAt: serverTimestamp()

    });



    await setDoc(doc(collection(db, "rooms", roomId, "activity")), {

      type: "USER_JOINED",

      uid: currentUser.uid,

      name: currentUser.name,

      joinedAt: serverTimestamp()

    });



    joinPassword.value = "";

    await openRoom(roomId);

  } catch (error) {

    console.error("Join room error:", error);

    message(joinMessage, error.message, "error");

  } finally {

    joinRoomBtn.disabled = false;

    joinRoomBtn.textContent = "Join Room";

  }

});



/* Open room and show room details */

async function openRoom(roomId) {

  const snap = await getDoc(doc(db, "rooms", roomId));

  if (!snap.exists()) throw new Error("Room no longer exists.");

  const data = snap.data();



  stopRoomListeners();

  isLeavingRoom = false;

  isDeletingRoom = false;



  currentRoomId = roomId;

  currentRoomName = data.roomName || "Unnamed Room";

  currentRoomLanguage = data.language || "Not specified";

  currentRoomCreatorName = data.creatorName || "Unknown";

  roomCreatorUid = data.creatorUid || null;



  $("roomIdDisplay").textContent = roomId;

  $("roomNameDisplay").textContent = "Room Name: " + currentRoomName;

  $("roomNameInfo").textContent = currentRoomName;

  $("roomLanguageInfo").textContent = currentRoomLanguage;

  $("roomCreatorInfo").textContent = currentRoomCreatorName;



  const isAdmin = currentUser.uid === roomCreatorUid;

  $("adminBadge").classList.toggle("hidden", !isAdmin);

  deleteRoomBtn.classList.toggle("hidden", !isAdmin);







  setup.classList.add("hidden");

  roomView.classList.remove("hidden");

  message(globalMessage, "");

  history.replaceState({}, "", `?room=${roomId}`);



  listenToParticipants(roomId);

  listenToOwnParticipant(roomId);

}



/* Detach listeners before resetting/leaving to avoid stale callbacks */

function stopRoomListeners() {

  ownListenerGeneration++;

  if (unsubscribeParticipants) {

    unsubscribeParticipants();

    unsubscribeParticipants = null;

  }

  if (unsubscribeOwnParticipant) {

    unsubscribeOwnParticipant();

    unsubscribeOwnParticipant = null;

  }

}



/* Live participant cards */

function listenToParticipants(roomId) {

  const ref = collection(db, "rooms", roomId, "participants");

  unsubscribeParticipants = onSnapshot(

    query(ref, orderBy("joinedAt", "asc")),

    snapshot => {

      if (currentRoomId !== roomId || isLeavingRoom || isDeletingRoom) return;



      participantsEl.innerHTML = "";

      participantCount.textContent =

        `${snapshot.size} ${snapshot.size === 1 ? "user" : "users"}`;



      if (snapshot.empty) {

        participantsEl.innerHTML = '<div class="empty">No participants.</div>';

        return;

      }



      snapshot.forEach(participantDoc => {

        const p = participantDoc.data();

        const isAdmin = p.uid === roomCreatorUid;

        const isSelf = p.uid === currentUser.uid;

        const card = document.createElement("div");

        card.className = "participant";



        card.innerHTML = `

          <div class="avatar">${escapeHtml((p.name || "?").charAt(0).toUpperCase())}</div>

          <div class="participant-info">

            <div class="participant-name">

              ${escapeHtml(p.name || "Unknown")}

              ${isSelf ? '<span style="color:#5C6690;font-size:10px">(You)</span>' : ""}

            </div>

            <div class="participant-role">${isAdmin ? "Room Creator" : "Participant"}</div>

          </div>

          <div class="participant-actions">

            ${isAdmin ? '<span class="admin-label">ADMIN</span>' : ""}

          </div>`;



        /* Only creator/admin gets controls for other participants */

        if (currentUser.uid === roomCreatorUid && !isAdmin) {

          const actions = card.querySelector(".participant-actions");



          const detailsBtn = document.createElement("button");

          detailsBtn.className = "details";

          detailsBtn.textContent = "Details";

          detailsBtn.addEventListener("click", () => {

            const existing = card.querySelector(".details-box");

            if (existing) return existing.remove();

            const box = document.createElement("div");

            box.className = "details-box";

            box.innerHTML = `Email: ${escapeHtml(p.email || "N/A")}<br>Mobile: ${escapeHtml(p.phone || "N/A")}`;

            card.querySelector(".participant-info").appendChild(box);

          });

          actions.prepend(detailsBtn);



          const removeBtn = document.createElement("button");

          removeBtn.className = "danger";

          removeBtn.textContent = "Remove";

          removeBtn.addEventListener("click", () => removeParticipant(p.uid, p.name));

          actions.appendChild(removeBtn);

        }

        participantsEl.appendChild(card);

      });

    },

    error => {

      if (currentRoomId === roomId && !isLeavingRoom && !isDeletingRoom) {

        globalError("Could not load participants: " + error.message);

      }

    }

  );

}



/* Detect if the admin removes this user */

function listenToOwnParticipant(roomId) {

  const generation = ownListenerGeneration;

  const ownRef = doc(db, "rooms", roomId, "participants", currentUser.uid);



  unsubscribeOwnParticipant = onSnapshot(ownRef, snap => {

    if (generation !== ownListenerGeneration) return;

    if (currentRoomId !== roomId || isLeavingRoom || isDeletingRoom) return;



    if (!snap.exists()) {

      stopRoomListeners();

      globalError("You have been removed from this room.");

      setTimeout(() => {

        if (!currentRoomId) return;

        resetRoomUI();

      }, 900);

    }

  }, error => {

    if (currentRoomId === roomId && !isLeavingRoom && !isDeletingRoom) {

      console.error("Own participant listener:", error);

    }

  });

}



/* Remove participant */

async function removeParticipant(uid, name) {

  if (!currentRoomId || currentUser.uid !== roomCreatorUid) return;

  if (!confirm(`Remove ${name || "this participant"} from the room?`)) return;



  try {

    const roomId = currentRoomId;

    await deleteDoc(doc(db, "rooms", roomId, "participants", uid));

    await setDoc(doc(collection(db, "rooms", roomId, "activity")), {

      type: "USER_REMOVED",

      uid,

      name: name || "",

      removedByUid: currentUser.uid,

      removedByName: currentUser.name,

      createdAt: serverTimestamp()

    });

    globalSuccess("Participant removed.");

  } catch (error) {

    globalError("Could not remove participant: " + error.message);

  }

}



async function copyInviteLink() {

    const inviteLink = window.location.href;



    try {

        await navigator.clipboard.writeText(inviteLink);

        alert("Invite link copied successfully!");

    } catch (error) {

        const textArea = document.createElement("textarea");

        textArea.value = inviteLink;

        textArea.style.position = "fixed";

        textArea.style.left = "-9999px";

        document.body.appendChild(textArea);

        textArea.select();



        const copied = document.execCommand("copy");

        textArea.remove();



        if (copied) {

            alert("Invite link copied successfully!");

        } else {

            alert("Could not copy invite link. Please try again.");

        }

    }

}



$("copyInvite").addEventListener("click", copyInviteLink);







/* Leave: admin and members leave without deleting the room */

leaveRoomBtn.addEventListener("click", async () => {

  if (!currentRoomId || isLeavingRoom || isDeletingRoom) return;

  if (!confirm(`Leave "${currentRoomName}"? The room will remain available.`)) return;



  const roomId = currentRoomId;

  isLeavingRoom = true;

  stopRoomListeners();

  leaveRoomBtn.disabled = true;

  leaveRoomBtn.textContent = "Leaving...";



  try {

    await deleteDoc(doc(db, "rooms", roomId, "participants", currentUser.uid));

    await setDoc(doc(collection(db, "rooms", roomId, "activity")), {

      type: "USER_LEFT",

      uid: currentUser.uid,

      name: currentUser.name,

      createdAt: serverTimestamp()

    });



    resetRoomUI();

    globalSuccess("You left the room. The room has not been deleted.");

  } catch (error) {

    isLeavingRoom = false;

    leaveRoomBtn.disabled = false;

    leaveRoomBtn.textContent = "Leave";

    globalError("Could not leave room: " + error.message);



    /* Restore listeners because leaving failed */

    if (currentRoomId) {

      listenToParticipants(currentRoomId);

      listenToOwnParticipant(currentRoomId);

    }

  }

});



/* Admin-only permanent delete of the currently open room */

deleteRoomBtn.addEventListener("click", async () => {

  if (!currentRoomId || currentUser.uid !== roomCreatorUid ||

      isLeavingRoom || isDeletingRoom) return;



  const roomId = currentRoomId;

  const roomName = currentRoomName;



  if (!confirm(`Permanently delete "${roomName}" (${roomId})?\n\nOnly this room and its participants/activity will be deleted.`)) return;



  isDeletingRoom = true;

  stopRoomListeners();

  deleteRoomBtn.disabled = true;

  deleteRoomBtn.textContent = "Deleting...";



  try {

    /* Delete participant and activity documents in safe-size batches */

    for (const sub of ["participants", "activity"]) {

      const snap = await getDocs(collection(db, "rooms", roomId, sub));

      for (let i = 0; i < snap.docs.length; i += 450) {

        const batch = writeBatch(db);

        snap.docs.slice(i, i + 450).forEach(d => batch.delete(d.ref));

        await batch.commit();

      }

    }



    await deleteDoc(doc(db, "rooms", roomId));

    resetRoomUI();

    globalSuccess(`Room ${roomId} deleted.`);

  } catch (error) {

    isDeletingRoom = false;

    deleteRoomBtn.disabled = false;

    deleteRoomBtn.textContent = "Delete Room";

    globalError("Could not delete room: " + error.message);



    if (currentRoomId) {

      listenToParticipants(currentRoomId);

      listenToOwnParticipant(currentRoomId);

    }

  }

});



/* Reset room state and controls */

function resetRoomUI() {

  stopRoomListeners();

  currentRoomId = null;

  currentRoomName = null;

  currentRoomLanguage = null;

  currentRoomCreatorName = null;

  roomCreatorUid = null;

  isLeavingRoom = false;

  isDeletingRoom = false;



  $("roomIdDisplay").textContent = "";

  $("roomNameDisplay").textContent = "Room Name: -";

  $("roomNameInfo").textContent = "-";

  $("roomLanguageInfo").textContent = "-";

  $("roomCreatorInfo").textContent = "-";



  $("adminBadge").classList.add("hidden");



  deleteRoomBtn.classList.add("hidden");

  deleteRoomBtn.disabled = false;

  deleteRoomBtn.textContent = "Delete Room";



  leaveRoomBtn.disabled = false;

  leaveRoomBtn.textContent = "Leave";



  participantsEl.innerHTML = '<div class="empty">Waiting for participants...</div>';

  participantCount.textContent = "0 users";



  roomInput.value = "";

  joinPassword.value = "";

  roomNameInput.value = "";

  createPassword.value = "";

  languageSelect.value = "";



  message(setupMessage, "");

  message(joinMessage, "");

  message(globalMessage, "");



  roomView.classList.add("hidden");

  setup.classList.remove("hidden");

  history.replaceState({}, "", location.pathname);

}



/* Back to test users */

$("backUsers").addEventListener("click", () => {

  location.href = "users.html";

});



/* Room ID input formatting */

roomInput.addEventListener("input", () => {

  roomInput.value = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 7);

});



/* Invite links fill the room ID but still require the password */

const params = new URLSearchParams(location.search);

const invitedRoom = (params.get("room") || "").trim().toUpperCase();

if (/^CS\d{5}$/.test(invitedRoom)) {

  roomInput.value = invitedRoom;

  message(joinMessage, "Enter the room password to join.", "");

}
