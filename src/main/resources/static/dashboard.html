<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code-Sync - Dashboard</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <header class="topbar">
    <div class="brand"><img src="logo.svg" alt=""><span>Code-<b>Sync</b></span></div>
    <div class="spacer"></div>
    <span id="role" class="badge hidden"></span>
    <span id="email" class="who"></span>
    <button id="logout" class="btn" type="button">Log out</button>
  </header>

  <main class="page">
    <div id="error" class="notice hidden"></div>

    <div id="content" class="hidden">
      <h2 id="hello">Welcome</h2>
      <p class="sub">What would you like to do?</p>

      <div class="grid">
        <form id="create-form" class="tile">
          <h3>Create a room</h3>
          <p>Start a new room, then share its link with your team.</p>
          <label for="room-name">Room name</label>
          <input id="room-name" maxlength="40" placeholder="e.g. PBL group work" autocomplete="off" required>
          <label for="room-lang">Language</label>
          <select id="room-lang">
            <option value="java">Java</option>
            <option value="python">Python</option>
          </select>
          <button class="btn primary-btn" type="submit">Create room</button>
        </form>

        <form id="join-form" class="tile">
          <h3>Join a room</h3>
          <p>Got a code from a teammate? Enter it here (or just open their link).</p>
          <label for="join-code">Room code</label>
          <input id="join-code" maxlength="6" placeholder="K7M2QX" autocomplete="off" required>
          <button class="btn primary-btn" type="submit">Join room</button>
        </form>

        <div id="admin-card" class="tile hidden">
          <h3>Admin panel</h3>
          <p>See all users and change who is an admin.</p>
          <a class="btn primary-btn" href="admin.html">Manage users</a>
        </div>
      </div>

      <h3 class="section-title">My rooms</h3>
      <p id="room-msg" class="toast"></p>
      <div id="room-list" class="room-list"></div>
    </div>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
