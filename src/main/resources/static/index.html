<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code-Sync - Log in</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <main class="card">
    <div class="brand-lg">
      <img src="logo.svg" alt="">
      <h1>Code-<b>Sync</b></h1>
    </div>
    <p class="tagline">Write code. Stay in sync.</p>

    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="tab active" role="tab">Log in</button>
      <button type="button" id="tab-signup" class="tab" role="tab">Sign up</button>
    </div>

    <form id="form" novalidate>
      <label id="name-row" class="hidden">Name
        <input id="name" autocomplete="name" maxlength="40">
      </label>
      <label>Email
        <input id="email" type="email" autocomplete="email">
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" minlength="6">
      </label>
      <p id="msg" class="msg" role="alert"></p>
      <button id="submit" class="primary" type="submit">Log in</button>
      <button id="forgot" type="button" class="link">Forgot password?</button>
    </form>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
